name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const format = (value) => `${value.pct.toFixed(2)}%`;
          const lines = [
            '## Coverage',
            '',
            '| Metric | Coverage |',
            '| --- | ---: |',
            `| Statements | ${format(data.statements)} |`,
            `| Branches | ${format(data.branches)} |`,
            `| Functions | ${format(data.functions)} |`,
            `| Lines | ${format(data.lines)} |`,
            '',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE
          else
            printf '%s\n' '## Coverage' '' 'Coverage report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dehtml-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Update coverage badge
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const pct = data.lines.pct.toFixed(2);
          const numeric = Number(data.lines.pct);
          const color = numeric >= 90 ? '#4c1' : numeric >= 75 ? '#dfb317' : '#e05d44';
          const label = 'Coverage';
          const value = `${pct}%`;
          const left = 93;
          const right = 117;
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="210" height="20" role="img" aria-label="${label}: ${value}"><title>${label}: ${value}</title><linearGradient id="a" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="210" height="20" rx="3"/></clipPath><g clip-path="url(#r)"><rect width="${left}" height="20" fill="#555"/><rect x="${left}" width="${right}" height="20" fill="${color}"/><rect width="210" height="20" fill="url(#a)"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11"><text x="46.5" y="15" fill="#010101" fill-opacity=".3">${label}</text><text x="46.5" y="14">${label}</text><text x="151.5" y="15" fill="#010101" fill-opacity=".3">${value}</text><text x="151.5" y="14">${value}</text></g></svg>`;
          fs.writeFileSync('.github/coverage-badge.svg', svg);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/coverage-badge.svg
          if git diff --cached --quiet; then
            echo "Coverage badge is already current."
          else
            git commit -m "chore(ci): update coverage badge"
            git push origin HEAD:main
          fi
